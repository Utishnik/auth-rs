name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Clink-arg=--ld-path=wild"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang
        
    - name: Build and install wild linker
      run: |
        git clone https://github.com/davidlattimore/wild
        cd wild
        cargo build --release
        sudo cp target/release/wild /usr/local/bin/
        cd ..
        rm -rf wild
        
    - name: Verify wild installation
      run: wild --version
      
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
